<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#17162a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="지온의 생일별" />
    <meta name="format-detection" content="telephone=no" />
    <title>지온과 사라진 생일별</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app" class="app" data-page="1">
      <header class="topbar">
        <div class="book-title-wrap">
          <span class="title-star" aria-hidden="true">✦</span>
          <h1 id="book-title" class="book-title">지온과 사라진 생일별</h1>
        </div>
        <button
          id="focus-button"
          class="icon-button"
          type="button"
          aria-label="책 화면 크게 보기"
          title="책 화면 크게 보기"
        >
          <span aria-hidden="true">⛶</span>
        </button>
      </header>

      <main class="reader" aria-labelledby="book-title">
        <button
          id="previous-button"
          class="turn-button turn-button-previous"
          type="button"
          aria-label="이전 쪽"
        >
          <span aria-hidden="true">‹</span>
        </button>

        <div id="page-stage" class="page-stage" aria-live="polite">
          <article id="book-page" class="book-page">
            <div class="page-art-frame">
              <img class="page-art" alt="" draggable="false" />
            </div>
            <div class="page-copy">
              <p class="page-text"></p>
            </div>
          </article>
          <div class="page-spine" aria-hidden="true"></div>
        </div>

        <button
          id="next-button"
          class="turn-button turn-button-next"
          type="button"
          aria-label="다음 쪽"
        >
          <span aria-hidden="true">›</span>
        </button>
      </main>

      <footer class="reader-footer">
        <div id="page-status" class="page-status" aria-live="polite">1 / 26</div>
        <input
          id="page-slider"
          class="page-slider"
          type="range"
          min="1"
          max="26"
          value="1"
          step="1"
          aria-label="쪽 선택"
        />
      </footer>

      <div id="gesture-hint" class="gesture-hint" role="status">
        화면을 좌우로 넘기거나 화살표를 눌러 보세요
      </div>
    </div>

    <noscript>이 그림책을 보려면 JavaScript를 켜 주세요.</noscript>
    <script src="story-data.js"></script>
    <script src="app.js" defer></script>
  </body>
</html>
